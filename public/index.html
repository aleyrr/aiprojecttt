<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NutriCare</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f2ec;--card:#fff;--tx:#1c1a33;--mu:#6a6880;--br:#e7e2d9;--pr:#4a3cc7;--pr2:#edeafc;--btn:#3d31a8;--ac:#ff6b57;--bad:#dc2626;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110f1f;--card:#1b1830;--tx:#efedfb;--mu:#a9a5c8;--br:#2f2b4d;--pr:#a99cff;--pr2:#2b2657;--btn:#5545d6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110f1f;--card:#1b1830;--tx:#efedfb;--mu:#a9a5c8;--br:#2f2b4d;--pr:#a99cff;--pr2:#2b2657;--btn:#5545d6;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0 0 8px;line-height:1.2}h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}p{margin:0 0 8px}.mu{color:var(--mu)}
.app{display:flex;min-height:100vh}aside{width:220px;padding:18px 12px;background:linear-gradient(180deg,#1b1740,#2d2470);color:#fff;border-right:0;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
aside .logo{font-weight:800;font-size:19px;color:#fff;padding:4px 10px 14px}aside a{display:block;padding:9px 12px;border-radius:9px;color:#d9d5ff;text-decoration:none;margin-bottom:2px;cursor:pointer}
aside a:hover{background:rgba(255,255,255,.1)}aside a.on{background:var(--ac);color:#fff}main{flex:1;padding:24px;max-width:1100px;min-width:0}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(40,30,120,.06)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat b{display:block;font-size:26px;color:var(--pr)}.stat span{color:var(--mu);font-size:13px}
button,.btn{background:var(--btn);color:#fff;border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.s{background:var(--pr2);color:var(--pr)}button.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}button.big{padding:14px 28px;font-size:17px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--br);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.sp{justify-content:space-between}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pr2);color:var(--pr)}.tag.w{background:#fde8e8;color:var(--bad)}
.im{height:92px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:8px}.im.sm{height:54px;width:54px;font-size:28px;margin:0;flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--br)}.tabs button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.bar{height:8px;border-radius:9px;background:var(--br);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--br);font-size:14px}.ov{overflow-x:auto}
.hero{text-align:center;padding:70px 20px 40px;max-width:820px;margin:0 auto}.hero h1{font-size:44px;background:linear-gradient(90deg,var(--pr),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;max-width:1100px;margin:0 auto}
.banner{background:#fff4d6;color:#6b4a00;border:1px solid #f3d27a;border-radius:12px;padding:12px 16px;margin-bottom:16px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.show{opacity:1}
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--br);font-size:16px}.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}.chat{display:grid;grid-template-columns:270px 1fr;gap:14px}.th{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}.th:hover,.th.on{background:var(--pr2)}.msgs{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px 0}.m{max-width:78%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--pr2);align-self:flex-start}.m.me{align-self:flex-end;background:var(--btn);color:#fff;border-radius:14px 14px 4px 14px}
@media(max-width:760px){.chat{grid-template-columns:1fr}.app{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:8px}aside .logo{padding:8px}aside a{white-space:nowrap}main{padding:14px}.hero h1{font-size:32px}}
</style></head><body><div id="v"></div><div id="toast"></div>
<script>
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=new Date();T.setHours(0,0,0,0);
const ds=o=>{const d=new Date(T);d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dd=s=>Math.round((new Date(s+'T00:00:00')-T)/864e5);
const nice=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
// name:[label,emoji,kcal,protein,carbs,fat]
const F={eggs:['Boiled eggs (2)','🥚',156,13,1,11],foul:['Foul medames (1 cup)','🫘',220,13,33,4],chicken:['Grilled chicken (150g)','🍗',248,46,0,5],koshari:['Koshari (1 plate)','🍛',450,14,80,9],rice:['Brown rice (1 cup)','🍚',216,5,45,2],fish:['Grilled fish (150g)','🐟',210,34,0,8],yogurt:['Greek yogurt (170g)','🥣',100,17,6,0],oats:['Oats (50g)','🌾',190,7,33,3],banana:['Banana','🍌',105,1,27,0],dates:['Dates (3)','🌴',70,1,19,0],salad:['Fresh salad bowl','🥗',50,2,10,0],lentil:['Lentil soup (1 bowl)','🍲',180,12,28,3],baladi:['Baladi bread (1)','🍞',150,5,30,1],almonds:['Almonds (28g)','🥜',165,6,6,14],apple:['Apple','🍎',95,0,25,0],sweet:['Sweet potato','🍠',112,2,26,0],falafel:['Falafel (4)','🧆',230,9,22,12],milk:['Milk (1 glass)','🥛',150,8,12,8]};
const FK=Object.keys(F);
const PL={lose:{n:'Weight Loss',d:'Lean proteins, high fibre, controlled carbs.',B:[['oats','banana'],['eggs','baladi','salad'],['yogurt','apple','almonds']],L:[['chicken','salad','rice'],['fish','salad','sweet'],['lentil','salad','baladi']],S:[['apple','almonds'],['yogurt'],['dates','milk']],D:[['fish','salad'],['chicken','salad'],['eggs','salad','lentil']]},
gain:{n:'Muscle Gain',d:'Calorie surplus with plenty of protein and slow carbs.',B:[['oats','milk','banana','almonds'],['foul','eggs','baladi'],['falafel','baladi','salad']],L:[['chicken','rice','salad'],['koshari','chicken'],['fish','rice','sweet']],S:[['yogurt','dates','almonds'],['milk','banana'],['falafel','baladi']],D:[['chicken','sweet','salad'],['fish','rice'],['eggs','baladi','yogurt']]},
maintain:{n:'Balanced Maintenance',d:'Everyday Egyptian meals in balanced portions.',B:[['foul','baladi'],['eggs','baladi','salad'],['oats','banana','milk']],L:[['koshari','salad'],['chicken','rice','salad'],['fish','sweet','salad']],S:[['apple','almonds'],['yogurt','dates'],['banana']],D:[['lentil','baladi'],['chicken','salad'],['falafel','salad']]}};
const SL=[['B','Breakfast','08:00'],['L','Lunch','14:00'],['S','Snack','17:00'],['D','Dinner','20:00']];
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let S={user:null,me:{},weights:[],appts:[],coaches:[],prods:[],payments:[],adm:null,chats:{u1:[{f:'them',t:'Hey! Did you try the lentil soup plan this week?',ts:Date.now()-36e5}],coach:[]},fr:{friends:['u1'],sent:[],inc:['u3']}};
try{const x=JSON.parse(localStorage.getItem('nc2')||'null');if(x){if(x.chats)Object.assign(S.chats,x.chats);if(x.fr)S.fr=x.fr}}catch(e){}
S.chats.coach=[];
const PEOPLE=[{id:'u1',n:'Nada Mostafa',e:'👩',s:'Skips breakfast and overeats at night',c:'Maadi'},{id:'u2',n:'Hassan Tarek',e:'🧔',s:'Can’t find trusted protein brands',c:'Nasr City'},{id:'u3',n:'Farida Ali',e:'👩‍🎓',s:'Meal prep on a student budget',c:'Dokki'},{id:'u4',n:'Mostafa Ibrahim',e:'🧑',s:'Wants to lose 15kg before his wedding',c:'Zamalek'},{id:'u5',n:'Dina Samy',e:'👩‍💼',s:'Eating healthy with a busy job',c:'New Cairo'},{id:'u6',n:'Amr Gamal',e:'👨',s:'Diabetes-friendly Egyptian meals',c:'6th October'}];
const pe=id=>PEOPLE.find(p=>p.id===id);
const sv=()=>{try{const c={...S.chats};delete c.coach;localStorage.setItem('nc2',JSON.stringify({chats:c,fr:S.fr}))}catch(e){}};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',2600)};
const co=id=>S.coaches.find(c=>c.id===id);
const img=(e,i)=>`<div class="im" style="background:linear-gradient(135deg,hsl(${i*37%360} 75% 88%),hsl(${(i*37+45)%360} 70% 76%))">${e}</div>`;
const cw=()=>S.weights.length?S.weights[S.weights.length-1].w:S.me.w;
function tg(){const m=S.me,bmr=10*m.w+6.25*m.h-5*m.age+(m.sex==='m'?5:-161),tdee=bmr*m.act,k=Math.round(tdee+{lose:-500,maintain:0,gain:300}[m.goal]),p=Math.round(1.9*m.w),f=Math.round(.27*k/9),c=Math.round((k-4*p-9*f)/4);return{bmr:Math.round(bmr),tdee:Math.round(tdee),k,p,f,c,bmi:(m.w/((m.h/100)**2)).toFixed(1)}}
function day(plan,d){const t=tg().k,P=PL[plan];const raw=SL.map(s=>({s,ids:P[s[0]][d%3]}));const base=raw.reduce((a,r)=>a+r.ids.reduce((x,i)=>x+F[i][2],0),0);const f=Math.max(.6,Math.min(2,Math.round(t/base*10)/10));
return{f,meals:raw.map(r=>({s:r.s,ids:r.ids,k:Math.round(r.ids.reduce((x,i)=>x+F[i][2],0)*f)}))}}
function chart(){const W=S.weights,g=S.me.gw,all=W.map(x=>x.w).concat(g),mn=Math.floor(Math.min(...all))-1,mx=Math.ceil(Math.max(...all))+1,X=i=>40+i*(540/Math.max(1,W.length-1)),Y=v=>200-(v-mn)/(mx-mn)*180;
return`<svg viewBox="0 0 600 230" style="width:100%"><g stroke="var(--br)" font-size="11" fill="var(--mu)">${[0,1,2,3,4].map(i=>{const v=mn+(mx-mn)*i/4;return`<line x1="40" x2="590" y1="${Y(v)}" y2="${Y(v)}"/><text x="2" y="${Y(v)+4}" stroke="none">${v.toFixed(0)}kg</text>`}).join('')}</g><line x1="40" x2="590" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--ac)" stroke-dasharray="6 4"/><text x="470" y="${Y(g)-5}" font-size="11" fill="var(--ac)">Goal ${g}kg</text><polyline fill="none" stroke="var(--pr)" stroke-width="3" points="${W.map((x,i)=>X(i)+','+Y(x.w)).join(' ')}"/>${W.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="4" fill="var(--pr)"><title>${x.d}: ${x.w}kg</title></circle>`).join('')}<g font-size="10" fill="var(--mu)">${W.map((x,i)=>i%2==0||W.length<8?`<text x="${X(i)-14}" y="222">${x.d.slice(5)}</text>`:'').join('')}</g></svg>`}
const NAV=[['dash','🏠 Dashboard'],['calc','🧮 Calculator'],['plan','🍽️ Meal Plans'],['db','🔎 Food & Products'],['weight','📈 Progress'],['coaches','🧑‍⚕️ Coaches'],['appts','📅 Appointments'],['friends','💬 Community'],['profile','👤 My Profile']];
const ANAV=[['admin','🛠️ Admin Dashboard'],['db','🔎 Food & Products'],['coaches','🧑‍⚕️ Coaches']];
let st={day:(T.getDay()+6)%7,tab:'f',q:'',open:null};
function shell(p,c){const n=S.user==='admin'?ANAV:NAV,due=S.appts.filter(a=>a.rem&&dd(a.d)>=0&&dd(a.d)<=2).length;
return`<div class="app"><aside><div class="logo">🥗 NutriCare</div>${n.map(x=>`<a class="${x[0]==p?'on':''}" onclick="go('${x[0]}')">${x[1]}${x[0]=='appts'&&due?` <span class="tag w">${due}</span>`:x[0]=='friends'&&S.fr.inc.length?` <span class="tag w">${S.fr.inc.length}</span>`:''}</a>`).join('')}<a onclick="logout()">🚪 Log out</a></aside><main><div class="top"><b>${(n.find(x=>x[0]==p)||['',''])[1]}</b><span class="row"><span class="mu">${S.user==='admin'?'Admin':E(S.me.name)}</span><span class="av">${S.user==='admin'?'A':E(S.me.name[0])}</span></span></div>${c}</main></div>`}
const API=async(m,p,b)=>{let r;try{r=await fetch('/api'+p,{method:m,credentials:'include',headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)})}catch(e){throw new Error('Cannot reach the server. Check your connection.')}const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Something went wrong');e.status=r.status;throw e}return d};
const EM={'Dr. Salma Hassan':'👩‍⚕️','Omar Fathy':'🧑‍🏫','Nour El-Din':'👨‍⚕️','Mariam Adel':'👩‍🍳'},MN={card:'Card',fawry:'Fawry',vodafone_cash:'Vodafone Cash',instapay:'InstaPay'};
const fail=e=>{if(e.status===401&&S.user){S.user=null;go('login')}toast(e.message)};
async function loadCoaches(){const L=await API('GET','/coaches');S.coaches=L.map(c=>({id:c.id,n:c.name,e:EM[c.name]||'🧑‍⚕️',sp:c.specialty||'',pr:c.monthlyPriceEgp,rt:c.rating||'–',cl:c.clientCount,b:c.bio||''}))}
async function loadProds(){const L=await API('GET','/products');S.prods=L.map((p,i)=>({id:p.id,i,n:p.name,br:p.brand||'',pr:p.priceEgp||0,v:p.verified?1:0,ing:p.ingredients||'',kc:p.kcal||0,p:p.proteinG||0}))}
async function loadMe(){const[pr,w]=await Promise.all([API('GET','/profile'),API('GET','/weights')]);S.weights=w.entries.map(x=>({d:x.date,w:x.weightKg}));S.me={name:pr.name,email:pr.email,phone:pr.phone||'',city:pr.city||'',age:pr.age||25,sex:pr.sex||'f',h:pr.heightCm||165,w:w.currentWeightKg||70,act:pr.activityFactor,goal:pr.goal,gw:pr.goalWeightKg||w.currentWeightKg||70,coach:pr.coachId,plan:pr.goal,notes:pr.notes||''}}
async function loadAppts(){const L=await API('GET','/appointments');S.appts=L.map(a=>({id:a.id,coach:a.coachId,d:a.date,t:a.time,type:a.type,rem:a.reminder?1:0}))}
async function loadPays(){const L=await API('GET','/payments');S.payments=L.map(p=>({id:p.reference,cn:p.coachName||'—',amt:p.totalEgp,m:MN[p.method]||p.method,d:String(p.paidAt).slice(0,10),status:p.status}))}
async function loadCoachChat(){if(!S.me.coach){S.chats.coach=[];return}const L=await API('GET','/messages/coach');S.chats.coach=L.map(m=>({f:m.sender==='client'?'me':'them',t:m.body,ts:new Date(m.createdAt).getTime()}))}
async function loadAdmin(){const[c,r,p,m]=await Promise.all([API('GET','/admin/clients'),API('GET','/admin/revenue'),API('GET','/admin/payments?status=pending'),API('GET','/admin/coach-messages')]);S.adm={clients:c,rev:r,pay:p,msgs:m,th:null,tid:null}}
async function hydrate(){const me=await API('GET','/auth/me');S.user=me.role;await loadCoaches();await loadProds();if(me.role==='admin')await loadAdmin();else{await loadMe();await Promise.all([loadAppts(),loadPays(),loadCoachChat()])}}
async function refresh(){try{await loadMe();await Promise.all([loadAppts(),loadPays(),loadCoaches(),loadCoachChat()]);render(true)}catch(e){}}
function go(p){location.hash=p}
async function logout(){try{await API('POST','/auth/logout')}catch(e){}S.user=null;S.me={};S.weights=[];S.appts=[];S.payments=[];S.adm=null;S.chats.coach=[];st.pay=null;sv();go('home');render()}
async function afterAuth(role){await hydrate();sv();go(role==='admin'?'admin':'dash');render();setTimeout(()=>{const d=S.appts.filter(a=>a.rem&&dd(a.d)>=0&&dd(a.d)<=1);if(role!=='admin'&&d.length)toast('🔔 Reminder: appointment '+(dd(d[0].d)?'tomorrow':'today')+' at '+d[0].t)},400)}
async function doLogin(){const g=i=>document.getElementById(i).value;try{const r=await API('POST','/auth/login',{email:g('em').trim(),password:g('pw')});await afterAuth(r.role)}catch(e){toast(e.message)}}
async function doReg(){const g=i=>document.getElementById(i).value,w=+g('rw'),a=+g('ra'),h=+g('rh');if(g('rn').trim().length<2)return toast('Enter your name');if(g('rp').length<8)return toast('Password must be at least 8 characters');if(!(a>=10&&a<=120))return toast('Enter a valid age');if(!(h>=50&&h<=250))return toast('Enter a valid height in cm');if(!(w>=30&&w<=300))return toast('Enter a valid weight in kg');try{await API('POST','/auth/register',{name:g('rn').trim(),email:g('re').trim(),password:g('rp')});await API('PUT','/calculator',{age:a,sex:g('rs'),heightCm:h,activityFactor:1.375,goal:g('rg'),goalWeightKg:+g('rgw')||w});await API('POST','/weights',{weightKg:w});st.reg=0;await afterAuth('client')}catch(e){toast(e.message)}}
const P={};
P.home=()=>`<div class="nav"><b style="font-size:20px;color:var(--pr)">🥗 NutriCare</b><button onclick="go('login')">Log in</button></div><div class="hero"><span class="tag">Made for Cairo 🇪🇬</span><h1>Eat smarter. Reach your goals. Trust what you buy.</h1><p class="mu" style="font-size:18px">Calculate your needs, follow weekly meal plans, check verified products, track your weight and work with a certified nutrition coach.</p><p><button class="big" onclick="go('login')">Go to Login →</button></p></div><div style="max-width:1000px;margin:0 auto;padding:0 20px 50px" class="g">${[['🧮','Nutrition calculator','Daily calories and macros based on you.'],['🍽️','Weekly meal plans','What to eat, when, and how much.'],['✅','Verified products','Spot trusted supplements and foods.'],['📈','Progress charts','Watch your weight move toward your goal.'],['🧑‍⚕️','Pick your coach','Compare coaches and prices.'],['🔔','Reminders','Never miss an appointment.'],['💬','Community & chat','Add friends who share your food struggles.'],['💳','Easy payments','Card, Fawry, Vodafone Cash or InstaPay.']].map(x=>`<div class="card"><div style="font-size:32px">${x[0]}</div><h3>${x[1]}</h3><p class="mu">${x[2]}</p></div>`).join('')}</div>`;
P.login=()=>{const o=(v,l)=>`<option value="${v}">${l}</option>`;return st.reg?`<div style="max-width:440px;margin:40px auto;padding:0 16px"><div class="card"><h2>Create your account</h2><p class="mu">Tell us a bit about you so we can calculate your plan.</p><label>Full name</label><input id="rn" placeholder="Alex Ahmed"><label>Email</label><input id="re" type="email" placeholder="alex@example.com"><label>Password (8+ characters)</label><input id="rp" type="password"><div class="g" style="grid-template-columns:1fr 1fr"><div><label>Age</label><input id="ra" type="number" value="28"></div><div><label>Sex</label><select id="rs">${o('f','Female')}${o('m','Male')}</select></div><div><label>Height (cm)</label><input id="rh" type="number" value="170"></div><div><label>Weight (kg)</label><input id="rw" type="number" step=".1" value="75"></div></div><label>Goal</label><select id="rg">${o('lose','Lose weight')}${o('maintain','Maintain')}${o('gain','Gain muscle')}</select><label>Goal weight (kg)</label><input id="rgw" type="number" step=".1" placeholder="e.g. 68"><p></p><div class="row"><button onclick="doReg()">Create account</button><button class="s" onclick="st.reg=0;render()">I have an account</button></div><p style="margin-top:12px"><a href="#home" style="color:var(--pr)">← Back to home</a></p></div></div>`:`<div style="max-width:400px;margin:70px auto;padding:0 16px"><div class="card"><h2>Welcome back 👋</h2><p class="mu">Log in to your NutriCare account.</p><label>Email</label><input id="em" type="email" placeholder="alex@example.com"><label>Password</label><input id="pw" type="password" onkeydown="if(event.key=='Enter')doLogin()"><p></p><div class="row"><button onclick="doLogin()">Log in</button><button class="s" onclick="st.reg=1;render()">Create account</button></div><p style="margin-top:12px"><a href="#home" style="color:var(--pr)">← Back to home</a></p></div></div>`};
P.dash=()=>{const m=S.me,t=tg(),c=co(m.coach),w=cw(),dy=day(m.plan,st.day>6?0:(T.getDay()+6)%7),nx=S.appts.filter(a=>dd(a.d)>=0).sort((a,b)=>a.d.localeCompare(b.d)||a.t.localeCompare(b.t))[0],due=S.appts.filter(a=>a.rem&&dd(a.d)>=0&&dd(a.d)<=2);
return`<h1>Hello, ${E(m.name.split(' ')[0])} 👋</h1><p class="mu">Here’s your day at a glance.</p>${due.map(a=>`<div class="banner">🔔 <b>${a.type}</b> with ${co(a.coach).n} ${dd(a.d)?'tomorrow':'today'} at ${a.t}${dd(a.d)==2?' (in 2 days)':''}.</div>`).join('')}
<div class="g"><div class="card stat"><b>${t.k}</b><span>Daily calorie target (from your calculator)</span></div><div class="card stat"><b>${w} kg</b><span>Current weight · goal ${m.gw} kg</span></div><div class="card stat"><b>${Math.abs(w-m.gw).toFixed(1)} kg</b><span>${w>m.gw?'left to lose':'left to gain'}</span></div><div class="card stat"><b>${nx?nice(nx.d):'None'}</b><span>${nx?nx.type+' · '+nx.t:'Next appointment'}</span></div></div>
<div class="g2"><div class="card"><h2>My current coach</h2>${c?`<div class="row"><div class="im sm" style="background:var(--pr2)">${c.e}</div><div><b>${c.n}</b><br><span class="mu">${c.sp} · ⭐ ${c.rt}</span></div></div><p style="margin-top:10px"><span class="tag">${c.pr} EGP / month</span></p><div class="row"><button class="s" onclick="go('appts')">Book session</button><button class="s" onclick="go('coaches')">Change coach</button></div>`:`<p class="mu">No coach yet.</p><button onclick="go('coaches')">Choose a coach</button>`}</div>
<div class="card"><h2>My plans</h2><p><b>🍽️ ${PL[m.plan].n} meal plan</b><br><span class="mu">${PL[m.plan].d}</span></p><p><b>🧑‍⚕️ Coaching package</b><br><span class="mu">${c?c.n+' · '+c.pr+' EGP/month, next billing '+nice(ds(12)):'Not subscribed'}</span></p><button class="s" onclick="go('plan')">Open weekly plan</button></div></div>
<div class="card"><div class="row sp"><h2>Today’s meals</h2><span class="tag">${dy.meals.reduce((a,x)=>a+x.k,0)} kcal</span></div><div class="g">${dy.meals.map(x=>`<div style="cursor:pointer" onclick="go('plan')">${img(F[x.ids[0]][1],FK.indexOf(x.ids[0]))}<b>${x.s[1]}</b> <span class="mu">${x.s[2]}</span><br><span class="mu">${x.ids.map(i=>F[i][0].split(' (')[0]).join(', ')}</span></div>`).join('')}</div></div>
<div class="card"><div class="row sp"><h2>Weight progress</h2><button class="s" onclick="go('weight')">Log weight</button></div>${chart()}</div>`};
P.calc=()=>{const m=S.me,t=tg(),o=(v,l,cur)=>`<option value="${v}" ${cur==v?'selected':''}>${l}</option>`;
return`<h1>Nutrition Calculator</h1><p class="mu">Results update your profile, meal plans and dashboard.</p><div class="g2"><div class="card"><div class="g" style="grid-template-columns:1fr 1fr"><div><label>Age</label><input id="a" type="number" value="${m.age}"></div><div><label>Sex</label><select id="sx">${o('f','Female',m.sex)}${o('m','Male',m.sex)}</select></div><div><label>Height (cm)</label><input id="h" type="number" value="${m.h}"></div><div><label>Weight (kg)</label><input id="w" type="number" step=".1" value="${cw()}"></div></div><label>Activity</label><select id="ac">${o(1.2,'Sedentary',m.act)}${o(1.375,'Light (1–3 days/wk)',m.act)}${o(1.55,'Moderate (3–5 days/wk)',m.act)}${o(1.725,'Very active',m.act)}</select><label>Goal</label><select id="gl">${o('lose','Lose weight',m.goal)}${o('maintain','Maintain',m.goal)}${o('gain','Gain muscle',m.goal)}</select><label>Goal weight (kg)</label><input id="gw" type="number" step=".1" value="${m.gw}"><p></p><button onclick="calc()">Calculate & save</button></div>
<div class="card"><h2>Your daily needs</h2><div class="stat"><b>${t.k} kcal</b><span>Target · BMR ${t.bmr} · maintenance ${t.tdee} · BMI ${t.bmi}</span></div><p></p>${[['Protein',t.p,4,'var(--pr)'],['Carbs',t.c,4,'#ff6b57'],['Fat',t.f,9,'#14b8a6']].map(x=>`<div class="row sp"><span>${x[0]}</span><b>${x[1]} g</b></div><div class="bar"><i style="width:${Math.round(x[1]*x[2]/t.k*100)}%;background:${x[3]}"></i></div><p></p>`).join('')}<div class="row"><button class="s" onclick="go('plan')">See my meal plan →</button><button class="s" onclick="go('db')">Browse foods</button></div></div></div>`};
async function calc(){const m=S.me,v=i=>document.getElementById(i).value,w=+v('w');try{await API('PUT','/calculator',{age:+v('a')||m.age,sex:v('sx'),heightCm:+v('h')||m.h,activityFactor:+v('ac'),goal:v('gl'),goalWeightKg:+v('gw')||m.gw});if(w&&w!==cw())await API('POST','/weights',{weightKg:w});await loadMe();toast('Saved! Meal plan updated to '+PL[S.me.plan].n);render()}catch(e){fail(e)}}
P.plan=()=>{const m=S.me,t=tg(),pl=m.plan,dy=day(pl,st.day),tot=dy.meals.reduce((a,x)=>a+x.k,0),mac=[0,0,0];dy.meals.forEach(x=>x.ids.forEach(i=>{mac[0]+=F[i][3]*dy.f;mac[1]+=F[i][4]*dy.f;mac[2]+=F[i][5]*dy.f}));
return`<h1>Weekly Meal Plans</h1><div class="tabs">${Object.keys(PL).map(k=>`<button class="${k==pl?'on':''}" onclick="S.me.plan='${k}';sv();render()">${PL[k].n}</button>`).join('')}</div><p class="mu">${PL[pl].d} Portions are scaled to your ${t.k} kcal target.</p><div class="tabs">${DAYS.map((d,i)=>`<button class="${i==st.day?'on':''}" onclick="st.day=${i};render()">${d.slice(0,3)}</button>`).join('')}</div>
<div class="card"><div class="row sp"><h2>${DAYS[st.day]}</h2><span class="tag">${tot} / ${t.k} kcal · portions ×${dy.f}</span></div><p class="mu">Protein ${Math.round(mac[0])}g · Carbs ${Math.round(mac[1])}g · Fat ${Math.round(mac[2])}g</p></div>
<div class="g2">${dy.meals.map(x=>`<div class="card"><div class="row sp"><h3>${x.s[1]} · ${x.s[2]}</h3><span class="tag">${x.k} kcal</span></div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${x.ids.map(i=>`<div style="cursor:pointer" onclick="st.q='${F[i][0].split(' ')[0]}';st.tab='f';go('db')">${img(F[i][1],FK.indexOf(i))}<b style="font-size:13px">${F[i][0]}</b><br><span class="mu" style="font-size:12px">×${dy.f} · ${Math.round(F[i][2]*dy.f)} kcal</span></div>`).join('')}</div></div>`).join('')}</div>`};
P.db=()=>{const q=st.q.toLowerCase(),fs=FK.filter(k=>F[k][0].toLowerCase().includes(q)),ps=S.prods.filter(p=>(p.n+p.br).toLowerCase().includes(q));
return`<h1>Food & Product Database</h1><div class="row"><input id="sq" placeholder="Search foods or products…" value="${E(st.q)}" oninput="st.q=this.value;render(true)" style="max-width:340px"><div class="tabs" style="margin:0"><button class="${st.tab=='f'?'on':''}" onclick="st.tab='f';render()">Foods (${fs.length})</button><button class="${st.tab=='p'?'on':''}" onclick="st.tab='p';render()">Products (${ps.length})</button></div></div><p></p>
${st.tab=='f'?`<div class="g">${fs.map(k=>{const f=F[k];return`<div class="card">${img(f[1],FK.indexOf(k))}<b>${f[0]}</b><p class="mu">${f[2]} kcal</p><div class="row"><span class="tag">P ${f[3]}g</span><span class="tag">C ${f[4]}g</span><span class="tag">F ${f[5]}g</span></div></div>`}).join('')}</div>`:`<div class="g">${ps.map(p=>`<div class="card">${img(p.v?'💊':'⚠️',p.i*5)}<b>${p.n}</b><p class="mu">${p.br} · ${p.pr} EGP</p><span class="tag ${p.v?'':'w'}">${p.v?'✔ Verified':'Not verified'}</span><p></p><button class="s" onclick="st.open=st.open=='${p.id}'?null:'${p.id}';render(true)">${st.open==p.id?'Hide':'Details'}</button>${st.open==p.id?`<p class="mu" style="margin-top:8px"><b>Ingredients:</b> ${E(p.ing)}<br><b>Per serving:</b> ${p.kc} kcal, ${p.p}g protein</p>${p.v?'':'<p style="color:var(--bad)">Be careful: this listing is not verified by NutriCare.</p>'}`:''}</div>`).join('')}</div>`}${(st.tab=='f'?fs:ps).length?'':'<p class="mu">No results.</p>'}`};
P.weight=()=>{const W=S.weights,s=W[0].w,c=cw(),g=S.me.gw;
return`<h1>Weight Progress</h1><div class="g"><div class="card stat"><b>${s} kg</b><span>Starting</span></div><div class="card stat"><b>${c} kg</b><span>Current</span></div><div class="card stat"><b>${(c-s).toFixed(1)} kg</b><span>Change</span></div><div class="card stat"><b>${Math.max(0,Math.round(100*(c-s)/(g-s)))||0}%</b><span>Of the way to ${g} kg</span></div></div><div class="card">${chart()}</div>
<div class="card"><h3>Log today’s weight</h3><div class="row"><input id="nw" type="number" step=".1" placeholder="e.g. 77.6" style="max-width:160px"><button onclick="addW()">Add entry</button></div><p class="mu">Your calorie target is recalculated automatically.</p></div>`};
async function addW(){const v=+document.getElementById('nw').value;if(!v||v<30||v>300)return toast('Enter a valid weight');try{await API('POST','/weights',{weightKg:v});await loadMe();toast('Weight logged');render()}catch(e){fail(e)}}
P.coaches=()=>{const adm=S.user==='admin';return`${st.pay&&!adm?checkout():''}<h1>Nutrition Coaches</h1><p class="mu">Pick the coach that fits your goal. Prices are per month.</p><div class="g">${S.coaches.map(c=>{const on=S.me.coach==c.id;return`<div class="card" ${on&&!adm?'style="border-color:var(--pr);border-width:2px"':''}><div class="im" style="background:var(--pr2)">${c.e}</div><h3>${c.n}</h3><p class="mu">${c.sp}<br>${c.b}<br>⭐ ${c.rt} · ${c.cl} clients</p><p><b style="font-size:22px;color:var(--pr)">${c.pr} EGP</b> <span class="mu">/ month</span></p>${adm?'':on?'<span class="tag">✔ Your current coach</span>':`<button onclick="pick('${c.id}')">Select & pay · ${c.pr} EGP</button>`}</div>`}).join('')}</div>${!adm&&S.payments.length?`<div class="card ov"><h3>Payment history</h3><table><tr><th>Date</th><th>Reference</th><th>Coach</th><th>Method</th><th>Amount</th><th>Status</th></tr>${S.payments.map(p=>`<tr><td>${p.d}</td><td>${p.id}</td><td>${E(p.cn)}</td><td>${p.m}</td><td>${p.amt} EGP</td><td>${p.status=='paid'?'Paid':'Awaiting confirmation'}</td></tr>`).join('')}</table></div>`:''}`};
function pick(id){st.pay=id;st.pm='card';render()}
function checkout(){const c=co(st.pay),sub=c.pr,vat=Math.round(sub*.14),tot=sub+vat,M=[['card','💳 Card'],['fawry','🏪 Fawry'],['wallet','📱 Vodafone Cash'],['instapay','🏦 InstaPay']],m=st.pm||'card';
return`<div class="card" style="border:2px solid var(--pr)"><div class="row sp"><h2>Checkout</h2><button class="s" onclick="st.pay=null;render()">✕ Cancel</button></div><div class="g2"><div><div class="tabs">${M.map(x=>`<button class="${x[0]==m?'on':''}" onclick="st.pm='${x[0]}';render(true)">${x[1]}</button>`).join('')}</div><p class=\"mu\">${m=='card'?'Card payments are completed through our payment provider.':m=='fawry'?'You’ll get a Fawry reference to pay at any Fawry outlet.':'Send the payment to our '+(m=='wallet'?'Vodafone Cash':'InstaPay')+' account.'} Your request is created now and your coach is set once the payment is confirmed.</p><p class=\"mu\" style=\"font-size:12px\">🔒 We never collect card numbers on this site.</p></div><div><h3>Order summary</h3><div class="row sp"><span>${c.e} ${c.n}</span><span>1 month</span></div><div class="row sp"><span class="mu">Subtotal</span><span>${sub} EGP</span></div><div class="row sp"><span class="mu">VAT 14%</span><span>${vat} EGP</span></div><div class="row sp"><b>Total</b><b style="font-size:20px;color:var(--pr)">${tot} EGP</b></div><p></p><button class="big" style="width:100%" onclick="pay()">Pay ${tot} EGP</button></div></div></div>`}
async function pay(){const m=st.pm||'card',v=i=>(document.getElementById(i)||{}).value||'',d=s=>s.replace(/\D/g,'');
if((m=='wallet'||m=='instapay')&&d(v('cw')).length<10)return toast('Enter a valid phone number');
try{const r=await API('POST','/subscriptions',{coachId:st.pay,method:{card:'card',fawry:'fawry',wallet:'vodafone_cash',instapay:'instapay'}[m]});st.pay=null;await loadPays();toast('✅ Payment '+r.payment.reference+' created. Your coach is set once it is confirmed.');render()}catch(e){fail(e)}}
P.appts=()=>{const L=S.appts.slice().sort((a,b)=>a.d.localeCompare(b.d)||a.t.localeCompare(b.t));
return`<h1>Appointments & Reminders</h1><div class="g2"><div class="card"><h3>Book a session</h3><p class=\"mu\">Booking with ${S.me.coach&&co(S.me.coach)?E(co(S.me.coach).n):'— choose a coach first'}</p><label>Type</label><select id="at"><option>Check-in call</option><option>Meal plan review</option><option>Progress review</option><option>Intro session</option></select><div class="row"><div><label>Date</label><input id="ad" type="date" min="${ds(0)}" value="${ds(3)}"></div><div><label>Time</label><input id="atm" type="time" value="11:00"></div></div><p></p><button onclick="addA()">Book & remind me</button></div>
<div class="card"><h3>Upcoming</h3>${L.length?L.map(a=>{const n=dd(a.d);return`<div class="row sp" style="border-bottom:1px solid var(--br);padding:8px 0"><div><b>${a.type}</b> · ${co(a.coach).n}<br><span class="mu">${nice(a.d)} at ${a.t} ${n<0?'(past)':n==0?'· today':'· in '+n+' days'}</span></div><div class="row"><button class="s" onclick="rem('${a.id}')">${a.rem?'🔔 On':'🔕 Off'}</button><button class="d" onclick="delA('${a.id}')">✕</button></div></div>`}).join(''):'<p class="mu">Nothing booked.</p>'}</div></div>`};
async function addA(){const v=i=>document.getElementById(i).value;if(!v('ad'))return;try{await API('POST','/appointments',{type:v('at'),date:v('ad'),time:v('atm'),reminder:true});await loadAppts();toast('Booked. Reminder is on 🔔');render()}catch(e){fail(e)}}
const rem=async id=>{const a=S.appts.find(x=>x.id==id);try{await API('PATCH','/appointments/'+id+'/reminder',{reminder:!a.rem});await loadAppts();render()}catch(e){fail(e)}},delA=async id=>{try{await API('DELETE','/appointments/'+id);await loadAppts();render()}catch(e){fail(e)}};
P.profile=()=>{const m=S.me,t=tg(),c=co(m.coach),i=(k,l,ty)=>`<div><label>${l}</label><input id="p_${k}" type="${ty||'text'}" value="${E(m[k])}"></div>`;
return`<h1>Client Profile</h1><div class="g2"><div class="card"><div class="row"><div class="im sm" style="background:var(--pr2)">👤</div><div><h2 style="margin:0">${E(m.name)}</h2><span class="mu">${E(m.city)} · ${m.age} yrs · ${m.h} cm</span></div></div><div class="g" style="grid-template-columns:1fr 1fr">${i('name','Name')}${i('email','Email')}${i('phone','Phone')}${i('city','City')}</div><label>Health notes / allergies</label><textarea id="p_notes" rows="3">${E(m.notes)}</textarea><p></p><button onclick="saveP()">Save profile</button></div>
<div class="card"><h3>Summary</h3><p>🎯 Goal: <b>${PL[m.goal].n}</b> (${cw()} → ${m.gw} kg)</p><p>🔥 Target: <b>${t.k} kcal</b> · P ${t.p}g · C ${t.c}g · F ${t.f}g</p><p>🧑‍⚕️ Coach: <b>${c?c.n+' · '+c.pr+' EGP/mo':'None'}</b></p><p>📅 Appointments: <b>${S.appts.filter(a=>dd(a.d)>=0).length}</b> upcoming</p><div class="row"><button class="s" onclick="go('calc')">Edit body stats</button><button class="s" onclick="go('weight')">Weight history</button></div></div></div>`};
async function saveP(){const b={};['name','email','phone','city','notes'].forEach(k=>b[k]=document.getElementById('p_'+k).value.trim());try{await API('PUT','/profile',b);await loadMe();toast('Profile saved');render()}catch(e){fail(e)}}
P.admin=()=>{const A=S.adm||{clients:[],rev:[],pay:[],msgs:[]},tot=A.rev.reduce((a,r)=>a+r.revenueEgp,0),mx=Math.max(...A.rev.map(r=>r.revenueEgp),1),th=S.adm&&S.adm.th;
return`<h1>Admin Dashboard</h1><div class="g"><div class="card stat"><b>${A.clients.length}</b><span>Clients</span></div><div class="card stat"><b>${tot.toLocaleString()} EGP</b><span>Revenue from confirmed payments</span></div><div class="card stat"><b>${A.pay.length}</b><span>Payments waiting for confirmation</span></div><div class="card stat"><b>${S.prods.filter(p=>p.v).length}/${S.prods.length}</b><span>Products verified</span></div></div>
<div class="g2"><div class="card"><h3>Coach revenue & pricing</h3>${A.rev.map(r=>{const c=co(r.coachId);return`<div class="row sp"><span>${E(r.name)} · ${r.payments} paid</span><span class="row"><input type="number" value="${c?c.pr:0}" style="width:90px" onchange="setPrice('${r.coachId}',this.value)"> EGP</span></div><div class="bar"><i style="width:${r.revenueEgp/mx*100}%"></i></div><p></p>`}).join('')}</div>
<div class="card"><h3>Product verification</h3>${S.prods.map(p=>`<div class="row sp" style="padding:4px 0"><span>${E(p.n)}</span><button class="${p.v?'s':'d'}" onclick="verifyP('${p.id}')">${p.v?'✔ Verified':'Verify'}</button></div>`).join('')}<div class="row" style="margin-top:10px"><input id="pn" placeholder="New product name" style="flex:1"><button onclick="addP()">Add</button></div></div></div>
<div class="card ov"><h3>Payments waiting for confirmation</h3>${A.pay.length?`<table><tr><th>Reference</th><th>Client</th><th>Coach</th><th>Method</th><th>Total</th><th></th></tr>${A.pay.map(p=>`<tr><td>${E(p.reference)}</td><td>${E(p.clientName)}</td><td>${E(p.coachName||'—')}</td><td>${E(MN[p.method]||p.method)}</td><td>${p.totalEgp} EGP</td><td><button onclick="confirmPay('${E(p.reference)}')">Confirm</button></td></tr>`).join('')}</table>`:'<p class="mu">Nothing waiting.</p>'}</div>
<div class="card"><h3>Coach messages</h3><div class="chat"><div>${A.msgs.length?A.msgs.map(m=>`<div class="th ${S.adm.tid==m.clientId?'on':''}" onclick="openThread('${m.clientId}')"><div style="min-width:0"><b>${E(m.clientName)}</b> ${m.needsReply?'<span class="tag w">needs reply</span>':''}<br><span class="mu" style="font-size:12px">${E(String(m.lastMessage).slice(0,40))}</span></div></div>`).join(''):'<p class="mu">No conversations yet.</p>'}</div><div>${th?`<div class="msgs">${th.map(m=>`<div class="m ${m.sender=='coach'?'me':''}">${E(m.body)}</div>`).join('')}</div><div class="row" style="flex-wrap:nowrap"><input id="ar" placeholder="Reply as the coach…" onkeydown="if(event.key=='Enter')sendReply()"><button onclick="sendReply()">Send</button></div>`:'<p class="mu">Select a conversation.</p>'}</div></div></div>
<div class="card ov"><h3>Clients</h3><table><tr><th>Client</th><th>Email</th><th>Coach</th><th>Plan</th><th>Start</th><th>Now</th></tr>${A.clients.map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.email)}</td><td>${E(x.coachName||'—')}</td><td>${E(x.planTitle||(PL[x.goal]||{}).n||'—')}</td><td>${x.startWeightKg??'—'} kg</td><td>${x.currentWeightKg??'—'} kg</td></tr>`).join('')||'<tr><td colspan="6" class="mu">No clients yet.</td></tr>'}</table></div>`};
async function setPrice(id,v){try{await API('PATCH','/admin/coaches/'+id+'/price',{monthlyPriceEgp:+v});await loadCoaches();await loadAdmin();toast('Price updated');render(true)}catch(e){fail(e)}}
async function verifyP(id){const p=S.prods.find(x=>x.id==id);try{await API('PATCH','/admin/products/'+id+'/verified',{verified:!p.v});await loadProds();render(true)}catch(e){fail(e)}}
async function confirmPay(ref){try{await API('POST','/admin/payments/'+encodeURIComponent(ref)+'/confirm');await loadAdmin();toast('Payment confirmed');render(true)}catch(e){fail(e)}}
async function openThread(id){try{S.adm.tid=id;S.adm.th=await API('GET','/admin/coach-messages/'+id);render(true)}catch(e){fail(e)}}
async function sendReply(){const el=document.getElementById('ar'),t=el.value.trim();if(!t)return;try{await API('POST','/admin/coach-messages/'+S.adm.tid,{body:t});S.adm.th=await API('GET','/admin/coach-messages/'+S.adm.tid);S.adm.msgs=await API('GET','/admin/coach-messages');render(true)}catch(e){fail(e)}}
async function addP(){const n=document.getElementById('pn').value.trim();if(!n)return;try{await API('POST','/admin/products',{name:n});await loadProds();render(true)}catch(e){fail(e)}}
function th(id){if(id=='coach'){const c=co(S.me.coach);return c?{n:c.n,e:c.e,s:'Your coach · '+c.sp}:null}if(id=='g')return{n:'Cairo Meal Ideas',e:'👥',s:'Group chat · 6 members'};const p=pe(id);return p?{n:p.n,e:p.e,s:p.s}:null}
const RF=['That sounds great, I’ll try it this week! 💪','Same here, I struggle with that too. What worked for you?','Want to swap meal ideas? I found a good koshari swap.','Thanks for sharing! Let’s keep each other accountable 🙌','Have you checked the verified products list? It helped me a lot.'],RC=['Great progress! Let’s review it in our next session.','Keep your protein near your daily target and log your weight weekly.','Send me what you ate today and I’ll adjust your plan.'];
function greet(id){(S.chats[id]=S.chats[id]||[]).push({f:'them',t:'Hi '+S.me.name.split(' ')[0]+'! Glad we connected 😊 What’s your biggest food struggle?',ts:Date.now()})}
function addF(id){S.fr.sent.push(id);sv();toast('Friend request sent');render(true);setTimeout(()=>{if(!S.fr.sent.includes(id))return;S.fr.sent=S.fr.sent.filter(x=>x!=id);S.fr.friends.push(id);greet(id);sv();toast('🎉 '+pe(id).n+' accepted your request');if(location.hash=='#friends')render(true)},2500)}
function acc(id){S.fr.inc=S.fr.inc.filter(x=>x!=id);S.fr.friends.push(id);greet(id);sv();toast('You and '+pe(id).n+' are now friends');st.ft='chat';st.chat=id;render()}
function dec(id){S.fr.inc=S.fr.inc.filter(x=>x!=id);sv();render()}
function send(){const el=document.getElementById('cm'),t=el.value.trim();if(!t)return;const k=st.chat;if(k=='coach'){el.value='';API('POST','/messages/coach',{body:t}).then(loadCoachChat).then(()=>render(true)).catch(fail);return}(S.chats[k]=S.chats[k]||[]).push({f:'me',t,ts:Date.now()});el.value='';sv();render(true);setTimeout(()=>{const r=k=='coach'?RC:RF,n=k=='g'?PEOPLE[Math.floor(Math.random()*PEOPLE.length)].n:undefined;(S.chats[k]=S.chats[k]||[]).push({f:'them',n,t:r[Math.floor(Math.random()*r.length)],ts:Date.now()});sv();if(location.hash=='#friends'&&st.chat==k&&(st.ft||'chat')=='chat')render(true)},1200)}
const chatUI=(ids,k)=>{const ms=S.chats[k]||[],h=th(k);return`<div class="chat"><div class="card" style="padding:8px">${ids.map(i=>{const x=th(i),l=(S.chats[i]||[]).slice(-1)[0];return`<div class="th ${i==k?'on':''}" onclick="st.chat='${i}';render()"><div class="im sm" style="background:var(--pr2);height:42px;width:42px;font-size:22px">${x.e}</div><div style="min-width:0"><b>${E(x.n)}</b><br><span class="mu" style="font-size:12px">${E((l?l.t:x.s).slice(0,28))}</span></div></div>`}).join('')}</div><div class="card"><div class="row"><b>${h.e} ${E(h.n)}</b><span class="mu">${E(h.s)}</span></div><div class="msgs" id="msgs">${ms.length?ms.map(m=>`<div class="m ${m.f=='me'?'me':''}">${m.n?`<b style="font-size:12px">${E(m.n)}</b><br>`:''}${E(m.t)}<div style="font-size:10px;opacity:.7">${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):'<p class="mu">Say hi 👋</p>'}</div><div class="row" style="flex-wrap:nowrap"><input id="cm" placeholder="Type a message…" onkeydown="if(event.key=='Enter')send()"><button onclick="send()">Send</button></div></div></div>`};
const findUI=()=>{const q=(st.fq||'').toLowerCase(),L=PEOPLE.filter(p=>!S.fr.friends.includes(p.id)&&(p.n+p.s+p.c).toLowerCase().includes(q));return`<input id="sq" placeholder="Search by name, area or struggle…" value="${E(st.fq||'')}" oninput="st.fq=this.value;render(true)" style="max-width:380px"><p></p><div class="g">${L.map(p=>`<div class="card"><div class="row"><div class="im sm" style="background:var(--pr2)">${p.e}</div><div><b>${p.n}</b><br><span class="mu">📍 ${p.c}</span></div></div><p style="margin-top:8px"><span class="tag">Struggling with</span><br>${p.s}</p>${S.fr.sent.includes(p.id)?'<button class="s" disabled>Request sent ✓</button>':S.fr.inc.includes(p.id)?`<button onclick="acc('${p.id}')">Accept request</button>`:`<button onclick="addF('${p.id}')">➕ Add friend</button>`}</div>`).join('')||'<p class="mu">No one found.</p>'}</div>`};
const reqUI=()=>`<div class="card"><h3>Friend requests</h3>${S.fr.inc.map(id=>{const p=pe(id);return`<div class="row sp" style="padding:8px 0"><span>${p.e} <b>${p.n}</b> <span class="mu">· ${p.s}</span></span><span class="row"><button onclick="acc('${id}')">Accept</button><button class="d" onclick="dec('${id}')">Decline</button></span></div>`}).join('')||'<p class="mu">No pending requests.</p>'}</div><div class="card"><h3>Sent</h3>${S.fr.sent.map(id=>`<p>${pe(id).e} ${pe(id).n} <span class="tag">Pending</span></p>`).join('')||'<p class="mu">Nothing pending.</p>'}</div>`;
P.friends=()=>{const ids=['coach'].concat(S.fr.friends,['g']).filter(i=>th(i)),k=st.chat&&ids.includes(st.chat)?st.chat:ids[0],t=st.ft||'chat';st.chat=k;return`<h1>Community</h1><p class="mu">Connect with people in Cairo who are figuring out what to eat, and chat with your coach.</p><div class="tabs">${[['chat','💬 Chats'],['find','➕ Find friends'],['req','📨 Requests ('+S.fr.inc.length+')']].map(x=>`<button class="${x[0]==t?'on':''}" onclick="st.ft='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${t=='chat'?chatUI(ids,k):t=='find'?findUI():reqUI()}`};
function render(keep){const h=(location.hash||'#home').slice(1),pub=h=='home'||h=='login';let p=P[h]?h:'home';
if(!pub&&!S.user){go('login');return}if(S.user==='admin'&&!ANAV.some(x=>x[0]==p)&&!pub)p='admin';
const cmE=document.getElementById('cm'),pv=cmE?cmE.value:'',hf=cmE&&document.activeElement===cmE,v=document.getElementById('v');v.innerHTML=pub?P[p]():shell(p,P[p]());window.scrollTo(0,keep?scrollY:0);const c2=document.getElementById('cm');if(c2&&keep){c2.value=pv;if(hf)c2.focus()}const mg=document.getElementById('msgs');if(mg)mg.scrollTop=mg.scrollHeight;
if(keep){const q=document.getElementById('sq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
window.addEventListener('hashchange',()=>render());
(async()=>{try{await hydrate()}catch(e){S.user=null}render()})();
setInterval(()=>{if(S.user!=='client')return;const h=location.hash;if(S.payments.some(p=>p.status=='pending')||(h=='#friends'&&st.chat=='coach'))refresh()},10000);
</script></body></html>
